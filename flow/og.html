<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG · Abalone</title>
<style>
  html, body { margin: 0; padding: 0; background: #14141f; }
  .card {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(600px circle at 80% 30%, rgba(170, 190, 255, 0.18), transparent 70%),
      radial-gradient(500px circle at 15% 85%, rgba(170, 190, 255, 0.10), transparent 70%),
      #14141f;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    padding: 0 96px;
    gap: 72px;
    box-sizing: border-box;
  }
  .pearl {
    width: 280px;
    height: 280px;
    flex-shrink: 0;
    filter: drop-shadow(0 16px 48px rgba(170, 190, 255, 0.28));
  }
  .copy { display: flex; flex-direction: column; gap: 20px; }
  .wordmark {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    opacity: 0.75;
  }
  .headline {
    font-size: 84px;
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1.03;
  }
  .values {
    font-size: 20px;
    font-weight: 400;
    opacity: 0.6;
    letter-spacing: 0.02em;
    display: flex;
    gap: 20px;
    margin-top: 4px;
  }
  .values span::after { content: "·"; margin-left: 20px; opacity: 0.5; }
  .values span:last-child::after { content: ""; margin-left: 0; }
</style>
</head>
<body>
<div class="card">
  <svg class="pearl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" aria-hidden="true">
  <!-- The app's default Dock icon, Ink (scripts/generate-app-icon.swift in the app repo): a black tile with
       22.5% corners and a faint white rim, and assets/brand/mark-on-dark.svg at 96% of the tile, centred. -->
  <defs>
    <linearGradient id="g" x1="33" y1="19" x2="87" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f5ef"/><stop offset="1" stop-color="#e9e3d8"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" rx="225" fill="#000000"/>
  <rect x="4" y="4" width="992" height="992" rx="221" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8"/>
  <g transform="translate(20 20) scale(8)">
    <path d="M62 12 C90 12 108 34 106 60 C104 84 86 102 64 106 C50 109 36 106 31 96 C27 88 33 82 33 76 C33 70 24 68 20 58 C15 44 22 26 38 17 C45 13 53 12 62 12 Z" fill="url(#g)"/>
    <path d="M38 37 C44 27 55 21 67 21 C56 25 47 31 43 40 Z" fill="#ffffff" opacity="0.9"/>
    <g fill="none" stroke="#1b2230" stroke-width="13" stroke-linecap="round">
      <path d="M58.95 38.4 l3.5 16"/><path d="M90.95 38.4 l3.5 16"/>
    </g>
  </g>
</svg>
  <div class="copy">
    <div class="wordmark">Abalone</div>
    <div class="headline">Speak 4× faster<br>than you type.</div>
    <div class="values"><span>Private</span><span>Offline</span><span>Free</span></div>
  </div>
</div>
</body>
</html>
